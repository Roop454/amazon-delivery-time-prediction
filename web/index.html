<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delivery Time Prediction Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">Portfolio Project</p>
        <h1>Amazon Delivery Time Prediction</h1>
        <p>
          Production-style ETA prediction powered by logistics signals. Enter shipment context,
          get a real-time delivery window, and inspect the model-driven reasoning.
        </p>
      </section>

      <section class="content-grid">
        <article class="card input-card">
          <h2>Shipment Inputs</h2>
          <form id="predictionForm">
            <div class="field-grid">
              <label>
                Pickup Latitude
                <input type="number" step="0.0001" name="pickup_lat" value="19.0760" required />
              </label>
              <label>
                Pickup Longitude
                <input type="number" step="0.0001" name="pickup_lng" value="72.8777" required />
              </label>
              <label>
                Drop Latitude
                <input type="number" step="0.0001" name="drop_lat" value="18.5204" required />
              </label>
              <label>
                Drop Longitude
                <input type="number" step="0.0001" name="drop_lng" value="73.8567" required />
              </label>
              <label>
                Package Weight (kg)
                <input type="number" step="0.1" name="package_weight_kg" value="2.5" required />
              </label>
              <label>
                Warehouse Load (%)
                <input type="number" step="0.1" name="warehouse_load_pct" value="62" required />
              </label>
              <label>
                Traffic
                <select name="traffic_bucket">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                  <option value="extreme">Extreme</option>
                </select>
              </label>
              <label>
                Weather
                <select name="weather_bucket">
                  <option value="clear" selected>Clear</option>
                  <option value="cloudy">Cloudy</option>
                  <option value="rain">Rain</option>
                  <option value="storm">Storm</option>
                </select>
              </label>
              <label>
                Vehicle Type
                <select name="vehicle_type">
                  <option value="bike">Bike</option>
                  <option value="van" selected>Van</option>
                  <option value="truck">Truck</option>
                </select>
              </label>
            </div>
            <button type="submit" id="predictBtn">Predict Delivery Time</button>
          </form>
        </article>

        <article class="card result-card" id="resultCard">
          <h2>Prediction Result</h2>
          <p class="empty-state">Run a prediction to view ETA and model explanation.</p>
        </article>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
